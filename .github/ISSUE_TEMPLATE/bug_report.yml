name: Bug report
description: Something behaves incorrectly, or a report comes out wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ### Before you attach anything

        **Please do not upload a real session file, report, or screenshot
        containing patient data.** This project handles clinical records, and an
        issue is public and permanent.

        The repository ships a **synthetic** example session at
        `test/fixtures/` (generated by `tool/generate_fixtures.dart`) that
        reproduces most format and report questions. Use that, or describe the
        shape of the data instead. See the
        [privacy statement](https://dbs-annotator.readthedocs.io/en/latest/privacy.html).

        If the bug looks like it could affect patient safety or the correctness
        of a filed document, say so in the title; those get looked at first.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open the Complete workflow
        2. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - iPadOS
        - Android
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: From Help > About, e.g. v0.5.0. Say "built from source" plus the commit if so.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        A synthetic file that reproduces it, the exported PDF/Word if the
        problem is in a report, or the console output. Check it carries no
        patient data first.
